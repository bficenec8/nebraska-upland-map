<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nebraska Upland Map</title>
  <meta name="theme-color" content="#3b2f1e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <!-- Top bar: search -->
  <div id="topbar">
    <div id="search-wrap">
      <input id="search" type="search" placeholder="Search WMAs & public areas…" autocomplete="off">
      <ul id="search-results" hidden></ul>
    </div>
  </div>

  <!-- Right-side buttons -->
  <div id="fabs">
    <button id="btn-layers" class="fab" title="Layers" aria-label="Layers">
      <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5zm-8.2 9L2 13l10 5 10-5-1.8-1L12 16l-8.2-4z"/></svg>
    </button>
    <button id="btn-locate" class="fab" title="My location" aria-label="My location">
      <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.07A7 7 0 0 0 13 5.07V3h-2v2.07A7 7 0 0 0 5.07 11H3v2h2.07A7 7 0 0 0 11 18.93V21h2v-2.07A7 7 0 0 0 18.93 13H21v-2zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
    </button>
  </div>

  <!-- Layers panel -->
  <div id="layers-panel" class="panel" hidden>
    <div class="panel-head">
      <h2>Map layers</h2>
      <button class="close" data-close="layers-panel" aria-label="Close">×</button>
    </div>
    <h3>Base map</h3>
    <div id="basemap-list" class="seg"></div>
    <h3>Public access (2026–27 Atlas)</h3>
    <div id="overlay-list"></div>
    <label class="row"><input type="checkbox" id="upland-only"> Upland focus <small>(hide areas whose species list has no upland birds, and turkey-only walk-in)</small></label>
    <h3>Land parcels</h3>
    <label class="row"><input type="checkbox" id="parcels-on" checked>
      <span class="swatch parcel"></span> Parcel boundaries <small>(zoom in to see)</small></label>
    <p class="fine">Tap anywhere on the map to identify the land there.
      Data: Nebraska Game &amp; Parks Commission, Nebraska OCIO statewide parcels.
      Always confirm access rules in the official Public Access Atlas.</p>
  </div>

  <!-- Bottom info sheet -->
  <div id="sheet" hidden>
    <div class="sheet-head">
      <div class="grip"></div>
      <button class="close" data-close="sheet" aria-label="Close">×</button>
    </div>
    <div id="sheet-body"></div>
  </div>

  <div id="toast" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
